<script>

// ── SUPABASE ──
const SB_URL = 'https://xiapoxfttymlkyvbpamt.supabase.co';
const SB_KEY = 'sb_publishable_Tws26IuyFraKHQ2MRQOOTQ_rQXY1AdM';
const SB_HDR = { 'apikey': SB_KEY, 'Authorization': 'Bearer '+SB_KEY, 'Content-Type': 'application/json' };

// localStorage como caché local (para que cargue rápido mientras espera a Supabase)
function lsGet(key){ try{const v=localStorage.getItem(key);return v?JSON.parse(v):null;}catch(e){return null;} }
function lsSet(key,val){ try{if(val===null)localStorage.removeItem(key);else localStorage.setItem(key,JSON.stringify(val));}catch(e){} }

const LIST_DURATION_MS  = 30 * 24 * 60 * 60 * 1000; // 30 días activos
const LIST_GRACE_MS    =  7 * 24 * 60 * 60 * 1000; // 7 días de gracia post-evento
const LIST_TOTAL_MS    = LIST_DURATION_MS + LIST_GRACE_MS; // 37 días total

function getEventEnd(data){
  if(data&&data.eventDate){
    // eventDate puede ser string "2026-08-12" o timestamp numérico
    const t=typeof data.eventDate==='number'?data.eventDate:new Date(data.eventDate).getTime();
    return isNaN(t)?Date.now():t;
  }
  return data&&data.created ? data.created+LIST_DURATION_MS : Date.now();
}
function isEventPast(data){
  return Date.now() > getEventEnd(data);
}
function isInGrace(data){
  const end=getEventEnd(data);
  return Date.now()>end && Date.now()<end+(7*24*60*60*1000);
}
function isExpired(data){
  if(!data) return false;
  const end=getEventEnd(data);
  return Date.now() > end+(7*24*60*60*1000);
}

// ── SEGURIDAD: hash de contraseñas con Web Crypto ──
async function hashPass(pass){
  try{
    const buf=new TextEncoder().encode(pass.toUpperCase());
    const hash=await crypto.subtle.digest('SHA-256',buf);
    return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){ return pass; } // fallback si crypto no está disponible
}

// ── sGetFresh: siempre lee de Supabase (ignora caché local) ──
async function sGetFresh(key){
  const code=key.replace('ev:','');
  try{
    const r=await fetch(`${SB_URL}/rest/v1/events?code=eq.${code}&select=data`,{headers:SB_HDR});
    const rows=await r.json();
    if(rows&&rows.length){const d=rows[0].data;lsSet(key,d);return d;}
  }catch(e){}
  return lsGet(key);
}

// ── sGetGuest: igual que sGet pero sin datos sensibles del organizador ──
async function sGetGuest(key){
  const data=await sGet(key);
  if(data){
    delete data.ownerPass;
    delete data.ownerPassHash;
    delete data.ownerEmail;
  }
  return data;
}

async function sGet(key){
  const code=key.replace('ev:','');
  try{
    const r=await fetch(`${SB_URL}/rest/v1/events?code=eq.${code}&select=data`,{headers:SB_HDR});
    const rows=await r.json();
    if(rows&&rows.length){const d=rows[0].data;lsSet(key,d);return d;}
  }catch(e){}
  // Fallback: caché local
  return lsGet(key);
}

async function sSet(key,val){
  lsSet(key,val); // guarda localmente de inmediato
  const code=key.replace('ev:','');
  try{
    if(val===null){
      await fetch(`${SB_URL}/rest/v1/events?code=eq.${code}`,{method:'DELETE',headers:SB_HDR});
    } else {
      await fetch(`${SB_URL}/rest/v1/events`,{
        method:'POST',
        headers:{...SB_HDR,'Prefer':'resolution=merge-duplicates'},
        body:JSON.stringify({code,data:val})
      });
    }
  }catch(e){console.warn('Supabase error:',e);}
}

// ── ESTADO GLOBAL ──
const app = document.getElementById('app');
let guestName = '';
let _showingCreated = false;
let _currentGuestCode = '';
function loadGuestName(code){
  try{return localStorage.getItem('gn:'+code)||'';}catch(e){return '';}
}

}

// ── UTILIDADES ──
function esc(s){return(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(){return 'g'+Date.now()+Math.random().toString(36).slice(2,5);}
function render(html){app.innerHTML=html;}
function genCode(){
  const letras='ABCDEFGHJKLMNPQRSTUVWXYZ';
  const nums='0123456789';
  const l1=letras[Math.floor(Math.random()*letras.length)];
  const l2=letras[Math.floor(Math.random()*letras.length)];
  const n1=Math.floor(Math.random()*10);
  const n2=Math.floor(Math.random()*10);
  const n3=Math.floor(Math.random()*10);
  const n4=Math.floor(Math.random()*10);
  return l1+l2+n1+n2+n3+n4;
}

// ── HASH (URL) ──
function getHash(){
  const h=location.hash.replace('#','');
  const p={};
  h.split('&').forEach(s=>{const[k,v]=s.split('=');if(k)p[k]=decodeURIComponent(v||'');});
  return p;
}
function setHash(p){
  location.hash=Object.entries(p).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
}

// ── CLIC CENTRAL (evita onclick="" inline bloqueados por seguridad) ──
window.addEventListener('error',e=>console.warn('err:',e.message));
window.addEventListener('unhandledrejection',e=>{console.warn('rej:',e.reason);e.preventDefault&&e.preventDefault();});

document.addEventListener('click',function(e){
  const el=e.target.closest('[data-a]');
  if(!el)return;
  const a=el.getAttribute('data-a');
  const x=el.getAttribute('data-x');
  const y=el.getAttribute('data-y');
  try{ dispatch(a,x,y); }
  catch(err){ console.warn('dispatch error',a,err); }
});

    'goToOwner':()=>{ _showingCreated=false; setHash({o:x}); renderOwner(x,1); },
    'ownerStep':()=>{ _ownerStep=parseInt(x); renderOwner(y,parseInt(x)); },

    'copyCode':()=>copyText(x),
    'downloadQR':async()=>{
      const owner=y, code2=x;
      // Mostrar modal previo con campo de CBU/alias

      document.body.appendChild(m);

        const alias=((document.getElementById('qrAlias')||{}).value||'').trim();
        m.remove();
        // Generar canvas
        const link=`https://elregalo.com.ar/#g=${code2}`;
        const qrUrl=`https://api.qrserver.com/v1/create-qr-code/?size=400x400&color=1d5c40&bgcolor=ffffff&data=${encodeURIComponent(link)}`;
        const hasAlias=!!alias;
        const H=hasAlias?600:510;
        const canvas=document.createElement('canvas');
        canvas.width=460; canvas.height=H;
        const ctx=canvas.getContext('2d');
        // Fondo blanco con borde redondeado
        ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,460,H);
        ctx.strokeStyle='#1d5c40'; ctx.lineWidth=5;
        if(ctx.roundRect){ctx.beginPath();ctx.roundRect(2,2,456,H-4,18);ctx.stroke();}
        // Header verde
        ctx.fillStyle='#1d5c40';
        ctx.beginPath();
        if(ctx.roundRect) ctx.roundRect(2,2,456,80,{upperLeft:18,upperRight:18,lowerLeft:0,lowerRight:0});
        else ctx.rect(2,2,456,80);
        ctx.fill();
        ctx.fillStyle='#ffffff';
        ctx.font='500 13px Arial,sans-serif'; ctx.textAlign='center';
        ctx.fillText('LISTA DE REGALOS DE',230,28);
        ctx.font='bold 26px Arial,sans-serif';
        // Truncar nombre si es muy largo
        let ownerText=owner.toUpperCase();
        ctx.fillText(ownerText,230,62);
        // QR sobre fondo blanco
        const img=new Image(); img.crossOrigin='anonymous';
        img.onload=()=>{
          ctx.drawImage(img,105,94,250,250);
          // Texto bajo QR
          ctx.fillStyle='#1d5c40'; ctx.font='bold 15px Arial,sans-serif';
          ctx.fillText('Escaneá para ver y elegir regalos',230,364);
          ctx.fillStyle='#444'; ctx.font='13px Arial,sans-serif';
          ctx.fillText('Código de lista: '+code2,230,386);
          // Alias si tiene
          if(hasAlias){
            // Caja alias
            ctx.fillStyle='#f0f7f0';
            ctx.beginPath();
            if(ctx.roundRect) ctx.roundRect(30,404,400,80,10); else ctx.rect(30,404,400,80);
            ctx.fill();
            ctx.strokeStyle='#c8e6d4'; ctx.lineWidth=1.5;
            ctx.beginPath();
            if(ctx.roundRect) ctx.roundRect(30,404,400,80,10); else ctx.rect(30,404,400,80);
            ctx.stroke();
            ctx.fillStyle='#555'; ctx.font='12px Arial,sans-serif';
            ctx.fillText('Para hacer tu aporte, transferí a:',230,428);
            ctx.fillStyle='#1d5c40'; ctx.font='bold 20px Arial,sans-serif';
            ctx.fillText(alias,230,458);
            ctx.fillStyle='#888'; ctx.font='11px Arial,sans-serif';
            ctx.fillText('alias / CBU / CVU',230,476);
          }
          // Separador
          const sepY=hasAlias?500:406;
          ctx.strokeStyle='#e0e0e0'; ctx.lineWidth=1;
          ctx.beginPath(); ctx.moveTo(30,sepY); ctx.lineTo(430,sepY); ctx.stroke();
          // Footer
          const fY=hasAlias?524:428;
          ctx.fillStyle='#1d5c40'; ctx.font='bold 16px Arial,sans-serif';
          ctx.fillText('elregalo.com.ar',230,fY);
          ctx.fillStyle='#888'; ctx.font='12px Arial,sans-serif';
          ctx.fillText('Gratis · Sin registro · Hecho en Argentina',230,fY+22);
          ctx.fillStyle='#aaa'; ctx.font='11px Arial,sans-serif';
          ctx.fillText('Creá tu propia lista en elregalo.com.ar',230,fY+40);
          const a=document.createElement('a');
          a.download=`qr-lista-${owner.toLowerCase().replace(/\s+/g,'-')}.png`;
          a.href=canvas.toDataURL('image/png'); a.click();
        };
        img.onerror=()=>{ window.open(qrUrl,'_blank'); };
        img.src=qrUrl;
      });

      w.document.close();

async function joinList(){
  const raw=((document.getElementById('joinCode')||{}).value||'').trim().toUpperCase();
  const code=raw.trim().toUpperCase();
  const isOwner=document.getElementById('iAmOwner')&&document.getElementById('iAmOwner').checked;
  if(!code){alert('Escribí el código');return;}
  const btn=document.querySelector('[data-a="joinList"]');
  if(btn){btn.disabled=true;btn.textContent='Buscando...';}
  const data=await sGet('ev:'+code);
  if(btn){btn.disabled=false;btn.textContent='Entrar';}
  if(!data){
    alert('No encontré esa lista. Revisá que el código esté bien escrito (2 letras y 4 números, mayúsculas).');
    return;
  }
  if(isOwner){
    const pass=((document.getElementById('joinPass')||{}).value||'').trim();
    if(!pass){alert('Escribí tu contraseña de organizador.');return;}
    // Verificar contraseña: primero con hash, luego con texto plano (compatibilidad)
    const enteredHash=await hashPass(pass);
    const hashMatch=data.ownerPassHash && enteredHash===data.ownerPassHash;
    const plainMatch=data.ownerPass && pass.toUpperCase()===data.ownerPass.toUpperCase();
    if(!hashMatch && !plainMatch){
      alert('Contraseña incorrecta. Revisá la captura de pantalla o el lugar donde guardaste la contraseña.');
      if(btn){btn.disabled=false;btn.textContent='Entrar';}
      return;
    }
    setHash({o:code}); renderOwner(code);
  } else { setHash({g:code}); renderGuest(code); }
}

function compressImage(file, maxPx=400, quality=0.65){
  return new Promise(resolve=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      const scale=Math.min(1,maxPx/Math.max(img.width,img.height));
      const w=Math.round(img.width*scale), h=Math.round(img.height*scale);
      const c=document.createElement('canvas');
      c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg',quality));
    };
    img.src=url;
  });
}

async function fetchOGImage(url){
  if(!url) return null;
  const proxies=[
    u=>'https://api.allorigins.win/get?url='+encodeURIComponent(u),
    u=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(u),
    u=>'https://corsproxy.io/?'+encodeURIComponent(u),
  ];
  const extractOG=(html)=>{
    // og:image en cualquier orden de atributos
    const patterns=[
      /<meta[^>]+property=["']og:image["'][^>]+content=["']([^"']+)["']/i,
      /<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:image["']/i,
      /<meta[^>]+name=["']og:image["'][^>]+content=["']([^"']+)["']/i,
      /<meta[^>]+content=["']([^"']+)["'][^>]+name=["']og:image["']/i,
      /<meta[^>]+name=["']twitter:image["'][^>]+content=["']([^"']+)["']/i,
      /<meta[^>]+content=["']([^"']+)["'][^>]+name=["']twitter:image["']/i,
    ];
    for(const p of patterns){
      const m=html.match(p);
      if(m&&m[1]&&m[1].startsWith('http')) return m[1];
    }
    return null;
  };
  for(const makeProxy of proxies){
    try{
      const r=await fetch(makeProxy(url),{signal:AbortSignal.timeout(6000)});
      if(!r.ok) continue;
      const ct=r.headers.get('content-type')||'';
      let html='';
      if(ct.includes('json')){
        const j=await r.json();
        html=j.contents||j.body||'';
      } else {
        html=await r.text();
      }
      if(!html) continue;
      const img=extractOG(html);
      if(img) return img;
    }catch{continue;}
  }
  return null;
}

function ownerGiftList(data,code){

  return data.gifts.map(g=>`
    <div class="gift${g.claimedBy?' taken':''}">

        <div style="display:flex;align-items:center;gap:8px">
          ${g.img?`<img src="${g.img}" style="width:40px;height:40px;border-radius:6px;object-fit:cover;flex-shrink:0;border:1px solid #ddd">`:
          `<span style="font-size:1.3rem">${getGiftIcon(g.name)}</span>`}

        </div>
        <div style="margin-top:4px">

          const gDonations=(data.moneyDonations||[]).filter(d=>d.giftId===g.id);

          const total=gDonations.reduce((s,d)=>s+(d.amountNum||0),0);

          return `<div style="margin-top:6px">
            <div style="display:flex;justify-content:space-between;font-size:.72rem;margin-bottom:3px">
              <span style="color:var(--accent);font-weight:600">💚 Aportado: <b>$${total.toLocaleString('es-AR')}</b></span>

async function addGift(code){
  const nameEl=document.getElementById('newName');
  const linkEl=document.getElementById('newLink');
  const name=(nameEl||{}).value||'';
  const manualLink=((linkEl||{}).value||'').trim();
  if(!name.trim()){alert('Escribí el nombre del regalo');return;}
  const allowPhys=document.getElementById('allowPhys')&&document.getElementById('allowPhys').checked;
  const allowDig=document.getElementById('allowDig')&&document.getElementById('allowDig').checked;
  const data=await sGet('ev:'+code);
  if(!data){alert('No se encontró la lista');return;}
  if(data.gifts&&data.gifts.length>=20){
    alert('La lista ya tiene 20 regalos — ese es el máximo permitido.\nBorrá alguno antes de agregar uno nuevo.');
    return;
  }
  const priceEl=document.getElementById('newPrice');
  const price=((priceEl||{}).value||'').trim();
  const allowMoney=!!(document.getElementById('allowMoney')&&document.getElementById('allowMoney').checked);
  if(allowMoney&&!price){
    alert('Si activás "Regalar el valor estimado", el precio estimado es obligatorio.\nCompletá el precio para que los invitados sepan cuánto aportar.');
    const priceField=document.getElementById('newPrice');
    if(priceField){priceField.focus();priceField.style.borderColor='#e74c3c';}
    return;
  }

  const giftImg=window._pendingGiftImg||null;
  window._pendingGiftImg=null;
  window._pendingLinkImg=null;
  const digitalReceiveContact=((document.getElementById('digitalReceiveContact')||{}).value||'').trim();
  data.gifts.push({id:uid(),name:name.trim(),allowPhys,allowDig,allowMoney,manualLink:manualLink||null,place:null,price:price||null,img:giftImg,claimedBy:null,digitalReceiveContact:digitalReceiveContact||null});
  await sSet('ev:'+code,data);
  // Limpiar campos sin recargar
  const imgInput=document.getElementById('giftImgInput');
  if(imgInput) imgInput.value='';
  const imgPrevLocal=document.getElementById('giftImgPreviewLocal');
  if(imgPrevLocal) imgPrevLocal.innerHTML='';
  const linkPrev=document.getElementById('linkImgPreview');
  if(linkPrev) linkPrev.innerHTML='';
  ['newName','newLink','newPrice','digitalReceiveContact'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.value='';
  });
  const moneyChk=document.getElementById('allowMoney');
  const digChk=document.getElementById('allowDig');
  const physChk=document.getElementById('allowPhys');
  if(moneyChk) moneyChk.checked=false;
  if(digChk) digChk.checked=false;
  if(physChk) physChk.checked=true;
  const pb=document.getElementById('priceBlock');
  if(pb) pb.style.display='none';
  const db=document.getElementById('digitalContactBlock');
  if(db) db.style.display='none';
  showSaved('[data-a="addGift"]','✅ Regalo agregado');
  // Actualizar solo la lista de regalos
  const newData=await sGet('ev:'+code);
  if(newData){
    const listCard=document.querySelector('[data-a="addGift"]')?.closest('.card')?.nextElementSibling;
    if(listCard) listCard.innerHTML=`<h3 style="margin:0 0 10px">Mi lista de deseos (${newData.gifts.length})</h3>${ownerGiftList(newData,code)}`;
  }
}

async function deleteGift(code,gid){
  const data=await sGet('ev:'+code);
  if(!data)return;
  const g=data.gifts.find(x=>x.id===gid);
  const nombre=g?g.name:'este regalo';
  if(!confirm('¿Querés eliminar "'+nombre+'" de tu lista?\n\nEsta acción no se puede deshacer.')) return;
  data.gifts=data.gifts.filter(g=>g.id!==gid);
  await sSet('ev:'+code,data);
  renderOwner(code);
}

async function freeGift(code,gid){
  const data=await sGet('ev:'+code);
  if(!data)return;
  const g=data.gifts.find(x=>x.id===gid);
  const nombre=g?g.name:'este regalo';
  if(!confirm('¿Querés liberar "'+nombre+'"?\n\nSe va a marcar como disponible y cualquier invitado podrá elegirlo de nuevo.')) return;

  renderOwner(code);

  const occInfo=occ(data);
  render(`

<span class="privacy-link" data-a="showFAQ" style="margin-right:12px">❓ Preguntas frecuentes</span>
<span class="privacy-link" data-a="showHowTo" style="margin-right:12px">📖 Cómo se usa</span>
<span class="privacy-link" data-a="showPrivacy" style="margin-right:12px">📄 Términos y condiciones</span>
<span class="privacy-link" data-a="showContact">✉️ Contacto</span><br>
<span style="font-size:.65rem;color:#aabcb2">© 2026 elregalo.com.ar · Todos los derechos reservados</span></footer>
  `);

  window._guestTimer=setTimeout(async()=>{
    if(getHash().g===code){ const d=await sGet('ev:'+code); if(d){ const el=document.querySelector('.card:last-of-type'); if(el)el.innerHTML=guestGiftList(d,code); } }

function guestGiftList(data,code){
  if(!data.gifts.length) return '<div class="empty">El organizador todavía no agregó regalos.</div>';
  return data.gifts.map(g=>{
    const isMe = g.claimedBy===guestName;
    const taken = !!g.claimedBy;
    const confirmed = g.claimedConfirmed;
    let statusLabel='';
    if(taken && confirmed && isMe)
      statusLabel=`<div class="claimed">🔒 Ya confirmaste este regalo — es tuyo</div>`;
    else if(taken && confirmed)
      statusLabel=`<div class="claimed">🔒 Ya fue seleccionado para regalo</div>`;
    else if(taken && isMe)
      statusLabel=`<div class="claimed" style="color:#b07d00">⏳ Lo tenés vos — falta confirmar definitivamente</div>`;
    else if(taken)
      statusLabel=`<div class="claimed" style="color:#b07d00">⏳ Ya fue reservado para regalo</div>`;
    let actionBtn='';
    if(!taken){
      actionBtn=`
        <button class="sm" data-a="pickGift" data-x="${esc(code)}" data-y="${esc(g.id)}">Elegir regalo</button>`;
    } else if(isMe && !confirmed){
      // Es mío pero sin confirmar: muestro dos botones
      actionBtn=`
        <div style="display:flex;flex-direction:column;gap:4px">
          <button class="sm" data-a="reopenConfirm" data-x="${esc(code)}" data-y="${esc(g.id)}"
            style="background:var(--accent);color:#fff;white-space:nowrap">
            ✅ Confirmar regalo
          </button>
          <button class="ghost sm" data-a="cancelGift" data-x="${esc(code)}" data-y="${esc(g.id)}"
            style="color:#c0392b;border-color:#c0392b;font-size:.72rem">
            Cancelar reserva
          </button>
        </div>`;
    }
    return `
      <div class="gift${taken?' taken':''}">
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">
            ${g.img?`<img src="${g.img}" style="width:44px;height:44px;border-radius:8px;object-fit:cover;flex-shrink:0;border:1px solid #ddd">`:
            `<span style="font-size:1.4rem">${getGiftIcon(g.name)}</span>`}
            <div class="gift-name">${esc(g.name)}</div>
          </div>
          ${(()=>{
            const gDonations=(data.moneyDonations||[]).filter(d=>d.giftId===g.id);
            if(!gDonations.length||!g.price) return '';
            const total=gDonations.reduce((s,d)=>s+(d.amountNum||0),0);
            const priceN=parseArgNum(g.price);
            const pct=priceN>0?Math.min(100,Math.round(total/priceN*100)):0;
            const moneda=total>=1000||priceN>=1000?'$':'$';
            return `<div style="margin-top:6px">
              <div style="display:flex;justify-content:space-between;font-size:.72rem;margin-bottom:3px">
                <span style="color:var(--accent);font-weight:600">💚 Aportado: <b>${moneda}${total.toLocaleString('es-AR')}</b></span>
                <span style="color:var(--muted)">de ${esc(g.price)}</span>
              </div>
              <div style="background:#e0e0e0;border-radius:20px;height:8px;overflow:hidden">
                <div style="background:${pct>=100?'#27ae60':'var(--accent)'};height:8px;border-radius:20px;width:${pct}%;transition:width .3s"></div>
              </div>
              <p style="font-size:.7rem;color:${pct>=100?'#27ae60':'var(--muted)'};margin:3px 0 0;text-align:right">
                ${pct>=100?'✅ ¡Valor cubierto por aportes!':pct+'% del valor aportado'}
              </p>
            </div>`;
          })()}
          ${statusLabel}
        </div>
        <div style="flex-shrink:0">${actionBtn}</div>
      </div>
    `;
  }).join('');
}

function formatAmount(input){
  let v=input.value.replace(/[^0-9]/g,'');
  if(v) input.value=parseInt(v).toLocaleString('es-AR');
}
function parseArgNum(str){
  // Elimina todo excepto dígitos — maneja formato argentino con puntos de miles
  if(!str) return 0;
  return parseFloat(String(str).replace(/[^0-9]/g,'')) || 0;
}
function parseAmount(input){
  return parseArgNum(input.value||'0');
}

function detectLocation(){
  const btn=document.getElementById('geoBtn');
  const cityInput=document.getElementById('pickCity');
  if(!navigator.geolocation){
    alert('Tu navegador no soporta detección de ubicación. Escribí tu ciudad a mano.');
    return;
  }
  if(btn){btn.disabled=true;btn.textContent='Detectando...';}
  navigator.geolocation.getCurrentPosition(
    async(pos)=>{
      const lat=pos.coords.latitude;
      const lon=pos.coords.longitude;
      // Convertimos coordenadas a nombre de ciudad con la API gratuita de Open-Meteo / Nominatim
      try{
        const r=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=es`);
        const d=await r.json();
        const city=d.address&&(d.address.city||d.address.town||d.address.village||d.address.county)||'';
        if(cityInput&&city) cityInput.value=city;
      }catch(e){
        // Si falla la geocodificación, dejamos las coordenadas como texto
        if(cityInput) cityInput.value=`${lat.toFixed(4)},${lon.toFixed(4)}`;
      }
      // Guardamos las coords para usar en los links de Maps
      window._geoLat=lat; window._geoLon=lon;
      if(btn){btn.disabled=false;btn.textContent='📍 Detectado';}
    },
    (err)=>{
      if(btn){btn.disabled=false;btn.textContent='📍 Detectar';}
      if(err.code===1) alert('No diste permiso de ubicación. Escribí tu ciudad a mano.');
      else alert('No se pudo detectar la ubicación. Escribí tu ciudad a mano.');
    },
    {timeout:10000}
  );
}

function detectStore(name){
  const n=name.toLowerCase();
  if(/libro|novela|cuento|manual|guía|poesía|enciclopedia/.test(n))
    return {store:'librería',icon:'📚'};
  if(/juguete|muñeca|barbie|lego|auto a escala|peluche|juego de mesa|puzzle/.test(n))
    return {store:'juguetería',icon:'🧸'};
  if(/plato|vaso|olla|sartén|cubierto|taza|jarra|cacerola|bazar|vajilla|fuente|bowl/.test(n))
    return {store:'bazar',icon:'🏺'};
  if(/lavarropa|heladera|microondas|cocina|horno|lavavajilla|aire acondicionado|ventilador|aspiradora|plancha|electrodoméstico|cafetera|tostadora|licuadora/.test(n))
    return {store:'tienda de electrodomésticos',icon:'🏪'};
  if(/ropa|camisa|pantalón|vestido|zapato|zapatilla|calzado|remera|buzo|abrigo|jean/.test(n))
    return {store:'tienda de ropa',icon:'👕'};
  if(/celular|tablet|computadora|laptop|auricular|parlante|cámara|smartwatch/.test(n))
    return {store:'tienda de electrónica',icon:'📱'};
  if(/perfume|crema|maquillaje|cosmético|desodorante|colonia/.test(n))
    return {store:'perfumería',icon:'💄'};
  if(/bicicleta|pelota|tenis|fútbol|básquet|deportivo|gym|fitness/.test(n))
    return {store:'tienda deportiva',icon:'⚽'};
  if(/mueble|silla|mesa|sillón|estante|cama|colchón/.test(n))
    return {store:'mueblería',icon:'🪑'};
  if(/flor|planta|maceta/.test(n))
    return {store:'florería',icon:'🌸'};
  if(/vino|champagne|whisky|cerveza|bebida|gourmet/.test(n))
    return {store:'vinoteca',icon:'🍷'};
  // Por defecto: tienda general
  return {store:'tienda',icon:'🛍️'};
}

function buildLinks(name,city,type,manualLink){
  const q=encodeURIComponent(name);
  const hasGeo=window._geoLat&&window._geoLon;
  const links=[];
  if(manualLink){
    links.push({label:'🔗 Link del organizador (recomendado)',url:manualLink,highlight:true});
  }
  if(type==='digital'){
    links.push({label:'📱 Amazon Kindle',url:'https://www.amazon.com/s?k='+q+'+kindle+ebook'});
    links.push({label:'📱 Google Play Libros',url:'https://play.google.com/store/search?q='+q+'&c=books'});
    links.push({label:'🔍 Buscar ebook en Google',url:'https://www.google.com/search?q='+encodeURIComponent('comprar ebook '+name)});
  } else {
    const {store,icon}=detectStore(name);
    if(hasGeo){
      links.push({label:icon+' '+store.charAt(0).toUpperCase()+store.slice(1)+' más cercana',
        url:`https://www.google.com/maps/search/${encodeURIComponent(store)}/@${window._geoLat},${window._geoLon},14z`});
      links.push({label:'📍 Buscar "'+name+'" cerca tuyo',
        url:`https://www.google.com/maps/search/${q}+${encodeURIComponent(store)}/@${window._geoLat},${window._geoLon},13z`});
    } else if(city){
      links.push({label:icon+' '+store.charAt(0).toUpperCase()+store.slice(1)+' en '+city,
        url:'https://www.google.com/maps/search/'+encodeURIComponent(store+' '+city)});
      links.push({label:'📍 Buscar "'+name+'" en '+city,
        url:'https://www.google.com/maps/search/'+encodeURIComponent(name+' '+store+' '+city)});
    }
    links.push({label:'🛒 MercadoLibre',url:'https://listado.mercadolibre.com.ar/'+q.replace(/%20/g,'-')});
    links.push({label:'🛒 Amazon',url:'https://www.amazon.com/s?k='+q});
    links.push({label:'🔍 Buscar en Google',url:'https://www.google.com/search?q='+encodeURIComponent('comprar '+name+(city?' en '+city:''))});
  }
  return links;
}


async function closeWithoutConfirm(code,gid){
  if(!confirm('¿Cerrás sin confirmar?\n\nSi cerrás, la reserva provisional se cancela y el regalo queda disponible para que otros lo elijan.\n\nTocá Aceptar para cancelar la reserva, o Cancelar para volver.')) return;
  // Liberar el regalo en Supabase
  const data=await sGet('ev:'+code);
  const g=data&&data.gifts.find(x=>x.id===gid);
  if(g&&!g.claimedConfirmed){
    g.claimedBy=null; g.claimedType=null; g.claimedCity=null; g.claimedConfirmed=false;
    await sSet('ev:'+code,data);
  }
  document.querySelectorAll('.modal-bg').forEach(m=>m.remove());
  renderGuest(code);
}

async function sendAddrRequest(code,combined){
  const [gid,addrType]=combined.split('|||');

  const data=await sGet('ev:'+code);
  const g=data&&data.gifts.find(x=>x.id===gid);
  if(!data||!g){alert('No se encontró la lista.');return;}
  // Guardar solicitud en los datos del evento
  if(!data.addrRequests) data.addrRequests=[];
  data.addrRequests.push({
    id:uid(),
    guestName: guestName||contact,
    contact:   contact,
    type:      addrType,
    giftName:  g.name,
    timestamp: Date.now()
  });
  await sSet('ev:'+code, data);
  // Mostrar confirmación
  const reqDiv=document.querySelector('[data-a="sendAddrRequest"]')?.closest('div[style]');

function showSaved(btnSelector, msg='✅ Guardado'){
  const btn=document.querySelector(btnSelector);
  if(!btn)return;
  const orig=btn.textContent;
  const origBg=btn.style.background;
  btn.textContent=msg;
  btn.style.background='#27ae60';
  btn.disabled=true;
  setTimeout(()=>{btn.textContent=orig;btn.style.background=origBg;btn.disabled=false;},2500);
}


async function saveAddress(type,code){
  const prefix=type==='home'?'home':'post';
  const v=id=>(document.getElementById(prefix+id)||{}).value||'';
  const addr={nombre:v('Nombre').trim(),calle:v('Calle').trim(),ciudad:v('Ciudad').trim(),cp:v('CP').trim(),pais:v('Pais').trim(),notas:v('Notas').trim()};
  const data=await sGet('ev:'+code);
  if(!data)return;
  if(type==='home') data.addrHome=addr;
  else data.addrPost=addr;
  await sSet('ev:'+code,data);
  showSaved(`[data-a="saveAddress"][data-x="${type}"]`);
}

function addrText(addr){
  if(!addr)return '';
  return [addr.nombre,addr.calle,addr.ciudad?(addr.ciudad+(addr.cp?' — CP: '+addr.cp:'')):addr.cp,addr.pais,addr.notas].filter(Boolean).join('\n');
}

function copyAddr(type,code){
  sGet('ev:'+code).then(data=>{
    if(!data)return;
    const addr=type==='home'?data.addrHome:data.addrPost;
    const txt=addrText(addr);
    if(!txt){alert('No hay dirección guardada todavía.');return;}
    navigator.clipboard.writeText(txt).then(()=>alert('¡Dirección copiada! Pegala en tu respuesta.')).catch(()=>prompt('Copiá esta dirección:',txt));
  });
}

// ── COMPARTIR ──
function getShareUrl(guestLink){
  // Si está en file://, el link no sirve para compartir — avisar
  if(guestLink.startsWith('file://')){
    return null;
  }
  return guestLink;
}

function shareNative(guestLink,title){
  const url=getShareUrl(guestLink);
  if(!url){
    alert('Para compartir el link necesitás publicar la app en internet (netlify.com/drop). Por ahora podés copiar el código de la lista y mandárselo.');
    return;
  }
  const txt=`🎁 ¡Ayudame eligiendo un regalo! Entrá a la lista: `;
  if(navigator.share){
    navigator.share({title,text:txt,url}).catch(()=>{});
  } else {
    copyText(url);
    alert('Link copiado. Pegalo en WhatsApp, Instagram o donde quieras.');
  }
}

function shareFacebook(guestLink){
  const url=getShareUrl(guestLink);
  if(!url){alert('Publicá la app en Netlify primero para poder compartir en redes.');return;}
  window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(url),'_blank');
}

function shareX(guestLink,title){
  const url=getShareUrl(guestLink);
  if(!url){alert('Publicá la app en Netlify primero para poder compartir en redes.');return;}
  const txt=encodeURIComponent('🎁 ¡Ayudame a elegir mi regalo! '+url);
  window.open('https://twitter.com/intent/tweet?text='+txt,'_blank');
}

function shareInstagram(guestLink){
  const url=getShareUrl(guestLink);
  if(!url){alert('Publicá la app en Netlify primero para poder compartir en redes.');return;}
  // Instagram no tiene API de compartir directa — se copia el link
  copyText(url);
  alert('📋 Link copiado. Abrí Instagram, pegalo en tu bio o en una historia como link.');
}

function shareOther(guestLink,title){
  const url=getShareUrl(guestLink);
  if(!url){alert('Publicá la app en Netlify primero para poder compartir.');return;}
  if(navigator.share){
    navigator.share({title,url}).catch(()=>{});
  } else {
    copyText(url);
    alert('Link copiado al portapapeles.');
  }
}

    <p style="font-size:.8rem;color:#444;line-height:1.6;margin:0 10px">
      Esta política se rige por las leyes de la <b>República Argentina</b>, en particular: Ley 25.326 (Protección de Datos Personales), Ley 24.240 (Defensa del Consumidor) y normativa de la AAIP (Agencia de Acceso a la Información Pública).
    </p>

    <button data-a="closeModal" style="width:100%;margin-top:16px">Entendido ✓</button>
  </div>`;
  document.body.appendChild(modal);
}

function clearLastList(){
  try{localStorage.removeItem('lastOwnerCode');localStorage.removeItem('lastOwnerTitle');}catch(e){}
  renderHome();
}

async function deleteList(code){
  if(!confirm('⚠️ ¿Seguro que querés borrar la lista?\n\nEsta acción NO se puede deshacer.\nSe borrarán todos los regalos, reservas y datos de la lista para siempre.\n\nSolo confirmá si estás seguro.')) return;
  // Borrar del storage
  try{ await sSet('ev:'+code, null); }catch(e){}
  // Borrar del localStorage si era la lista guardada
  if(lsGet('lastOwnerCode')===code){
    try{localStorage.removeItem('lastOwnerCode');localStorage.removeItem('lastOwnerTitle');}catch(e){}
  }
  renderHome();
}


// ── PRÓXIMAMENTE (cambiar a false cuando esté listo) ──
const COMING_SOON = false;

// ── INICIO ──
(async function init(){
  if(COMING_SOON){ renderComingSoon(); return; }
  const h=getHash();
  if(h.o) renderOwner(h.o);
  else if(h.g) renderGuest(h.g);
  else renderHome();
})();
document.addEventListener('input',function(e){
  if(e.target&&e.target.id==='ownerName') autoFillTitle();
});
document.addEventListener('change',function(e){
  if(e.target&&e.target.id==='allowDig'){
    const block=document.getElementById('digitalContactBlock');
    if(block) block.style.display=e.target.checked?'block':'none';
    if(!e.target.checked){
      const inp=document.getElementById('digitalReceiveContact');
      if(inp) inp.value='';
    }
  }
  if(e.target&&e.target.id==='allowMoney'){
    const priceBlock=document.getElementById('priceBlock');
    const priceField=document.getElementById('newPrice');
    if(priceBlock){
      priceBlock.style.display=e.target.checked?'block':'none';
      if(e.target.checked&&priceField){
        priceField.scrollIntoView({behavior:'smooth',block:'center'});
        priceField.focus();
      } else if(!e.target.checked&&priceField){
        priceField.value='';
      }
    }
  }
});
window.addEventListener('hashchange',function(){
  if(COMING_SOON){ renderComingSoon(); return; }
  if(_showingCreated) return;
  clearTimeout(window._ownerTimer);clearTimeout(window._guestTimer);
  const h=getHash();
  if(h.o) renderOwner(h.o);
  else if(h.g) renderGuest(h.g);
  else renderHome();
});
</script>
