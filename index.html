<script>
// ── EMAILJS (API REST directa, sin SDK) ──
const EJS_SERVICE  = 'service_kn3y6vo';
const EJS_TEMPLATE = 'template_uyuzaxr';
const EJS_KEY      = 'o-_TYLRdXUIX3FZZb';

async function sendMailAuto(toEmail, toName, subject, body){
  try{
    const res = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        service_id:   EJS_SERVICE,
        template_id:  EJS_TEMPLATE,
        user_id:      EJS_KEY,
        template_params: {
          to_email: toEmail,
          to_name:  toName,
          name:     toName,
          email:    toEmail,
          title:    subject,
          subject:  subject,
          message:  body
        }
      })
    });
    const txt = await res.text();
    if(!res.ok){
      console.error('EmailJS error HTTP '+res.status+':', txt);
      return false;
    }
    console.log('EmailJS OK:', txt);
    return true;
  } catch(e){
    console.error('EmailJS fetch error:', e.message);
    return false;
  }
}

// ── SUPABASE ──
const SB_URL = 'https://xiapoxfttymlkyvbpamt.supabase.co';
const SB_KEY = 'sb_publishable_Tws26IuyFraKHQ2MRQOOTQ_rQXY1AdM';
const SB_HDR = { 'apikey': SB_KEY, 'Authorization': 'Bearer '+SB_KEY, 'Content-Type': 'application/json' };

// localStorage como caché local (para que cargue rápido mientras espera a Supabase)
function lsGet(key){ try{const v=localStorage.getItem(key);return v?JSON.parse(v):null;}catch(e){return null;} }
function lsSet(key,val){ try{if(val===null)localStorage.removeItem(key);else localStorage.setItem(key,JSON.stringify(val));}catch(e){} }

async function sGet(key){
  const code=key.replace('ev:','');
  try{
    const r=await fetch(`${SB_URL}/rest/v1/events?code=eq.${code}&select=data`,{headers:SB_HDR});
    const rows=await r.json();
    if(rows&&rows.length){const d=rows[0].data;lsSet(key,d);return d;}
  }catch(e){}
  // Fallback: caché local
  return lsGet(key);
}

async function sSet(key,val){
  lsSet(key,val); // guarda localmente de inmediato
  const code=key.replace('ev:','');
  try{
    if(val===null){
      await fetch(`${SB_URL}/rest/v1/events?code=eq.${code}`,{method:'DELETE',headers:SB_HDR});
    } else {
      await fetch(`${SB_URL}/rest/v1/events`,{
        method:'POST',
        headers:{...SB_HDR,'Prefer':'resolution=merge-duplicates'},
        body:JSON.stringify({code,data:val})
      });
    }
  }catch(e){console.warn('Supabase error:',e);}
}

// ── ESTADO GLOBAL ──
const app = document.getElementById('app');

// ── UTILIDADES ──
function esc(s){return(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(){return 'g'+Date.now()+Math.random().toString(36).slice(2,5);}

function genCode(){return Math.random().toString(36).slice(2,7).toUpperCase();}

// ── HASH (URL) ──
function getHash(){
  const h=location.hash.replace('#','');
  const p={};
  h.split('&').forEach(s=>{const[k,v]=s.split('=');if(k)p[k]=decodeURIComponent(v||'');});
  return p;
}
function setHash(p){
  location.hash=Object.entries(p).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
}

// ── CLIC CENTRAL (evita onclick="" inline bloqueados por seguridad) ──
window.addEventListener('error',e=>console.warn('err:',e.message));
window.addEventListener('unhandledrejection',e=>{console.warn('rej:',e.reason);e.preventDefault&&e.preventDefault();});

document.addEventListener('click',function(e){
  const el=e.target.closest('[data-a]');
  if(!el)return;
  const a=el.getAttribute('data-a');
  const x=el.getAttribute('data-x');
  const y=el.getAttribute('data-y');
  try{ dispatch(a,x,y); }
  catch(err){ console.warn('dispatch error',a,err); }
});

function dispatch(a,x,y){
  const map={
    'home':()=>renderHome(),
    'showPrivacy':()=>showPrivacy(),
    'goCreate':()=>renderCreate(),
    'setOcc':()=>{
      document.querySelectorAll('.occ-btn').forEach(b=>b.classList.remove('active'));
      const btn=document.querySelector(`.occ-btn[data-x="${x}"]`);
      if(btn)btn.classList.add('active');
      const inp=document.getElementById('occType');

      const lbl=document.getElementById('ownerLabel');
      const oData=OCCASIONS[x]||OCCASIONS['cumple'];
      if(lbl)lbl.textContent='Nombre de '+oData.person;
    },
    'goJoin':()=>renderJoin(),
    'goLastList':()=>{ const c=lsGet('lastOwnerCode'); if(c){setHash({o:c});renderOwner(c);} },
    'clearLastList':()=>clearLastList(),
    'sendAddrRequest':()=>sendAddrRequest(x,y),
    'copyAddrReq':()=>copyAddrReqMsg(x,y),
    'copyMsg':()=>copyText(x),
    'notifyOwner':()=>openMailto(buildNotifyMailto(x,...y.split('|||'))),
    'saveAlias':()=>saveAlias(x),
    'saveAddress':()=>saveAddress(x,y),
    'copyAddr':()=>copyAddr(x,y),
    'copyAddrForReq':()=>copyAddr(x,y),
    'deleteList':()=>deleteList(x),
    'createList':()=>createList(),
    'joinList':()=>joinList(),
    'addGift':()=>addGift(x),
    'deleteGift':()=>deleteGift(x,y),
    'freeGift':()=>freeGift(x,y),
    'setName':()=>setName(),
    'changeName':()=>changeName(),
    'pickGift':()=>pickGift(x,y),
    'cancelGift':()=>cancelGift(x,y),
    'giftMoney':()=>giftMoney(x,y),
    'confirmMoneyGift':()=>confirmMoneyGift(x,y),
    'reopenConfirm':()=>reopenConfirm(x,y),
    'setType':()=>setType(x),
    'detectLocation':()=>detectLocation(),
    'closeModal':()=>{ const m=document.querySelector('.modal-bg');if(m)m.remove(); },
    'confirmPick':()=>confirmPick(x,y),
    'finalConfirm':()=>finalConfirm(x,y),
    'closeAndRefresh':()=>{ const m=document.querySelector('.modal-bg');if(m)m.remove(); renderGuest(x); },
    'copyLink':()=>copyText(x),
    'copyText':()=>copyText(x),
    'goToOwner':()=>{ _showingCreated=false; setHash({o:x}); renderOwner(x,1); },
    'ownerStep':()=>{ _ownerStep=parseInt(x); renderOwner(y,parseInt(x)); },

    'copyCode':()=>copyText(x),
    'shareNative':()=>shareNative(x,y),
    'shareFacebook':()=>shareFacebook(x),
    'shareX':()=>shareX(x,y),
    'shareInstagram':()=>shareInstagram(x),
    'shareOther':()=>shareOther(x,y),
  };
  if(map[a]) map[a](); else console.warn('acción desconocida:',a);
}

function copyText(t){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>alert('¡Copiado!')).catch(()=>alert(t));
  } else { alert(t); }
}

// ── PANTALLAS ──

// ── OCASIÓN ──
const OCCASIONS={

  'baby':    {icon:'👶', label:'Baby shower',  person:'el/la bebé',          verb:'baby shower'},
  'graduacion':{icon:'🎓',label:'Graduación', person:'el/la graduado/a',     verb:'graduación'},
  'mudanza': {icon:'🏠', label:'Mudanza',      person:'los que se mudan',    verb:'mudanza'},

function genPass(){
  // Genera contraseña aleatoria simple: 3 palabras cortas + número
  const words=['sol','mar','rio','luz','voz','paz','flor','luna','cielo','verde','rosa','azul','rojo','nube'];
  const w1=words[Math.floor(Math.random()*words.length)];
  const w2=words[Math.floor(Math.random()*words.length)];
  const n=Math.floor(Math.random()*90)+10;
  return w1+'-'+w2+'-'+n;
}

async function createList(){
  const owner=(document.getElementById('ownerName')||{}).value||'';
  const title=(document.getElementById('listTitle')||{}).value||'';
  if(!owner.trim()){alert('Escribí el nombre de quien festeja');return;}
  const email=((document.getElementById('ownerEmail')||{}).value||'').trim();

  const btn=document.querySelector('[data-a="createList"]');
  if(btn){btn.disabled=true;btn.textContent='Creando...';}
  const pass=genPass();
  const code=genCode();
  const occType=(document.getElementById('occType')||{}).value||'cumple';
  const occData=OCCASIONS[occType]||OCCASIONS['cumple'];
  const data={owner:owner.trim(),occasion:occType,title:title.trim()||occData.label+' de '+owner.trim(),ownerEmail:email,ownerPass:pass,gifts:[],created:Date.now()};
  await sSet('ev:'+code, data);
  lsSet('lastOwnerCode', code);
  lsSet('lastOwnerTitle', data.title);

  // Bloquear hashchange y mostrar pantalla de confirmación
  _showingCreated = true;
  renderCreated(code, data, pass);
}

async function joinList(){
  const raw=(document.getElementById('joinCode')||{}).value||'';
  const code=raw.trim().toUpperCase();
  const isOwner=document.getElementById('iAmOwner')&&document.getElementById('iAmOwner').checked;
  if(!code){alert('Escribí el código');return;}
  const btn=document.querySelector('[data-a="joinList"]');
  if(btn){btn.disabled=true;btn.textContent='Buscando...';}
  const data=await sGet('ev:'+code);
  if(btn){btn.disabled=false;btn.textContent='Entrar';}
  if(!data){
    alert('No encontré esa lista. Revisá que el código esté bien escrito (5 letras, mayúsculas).');
    return;
  }
  if(isOwner){
    const pass=((document.getElementById('joinPass')||{}).value||'').trim();
    if(!pass){alert('Escribí tu contraseña de organizador.');return;}
    if(data.ownerPass && pass!==data.ownerPass){
      alert('Contraseña incorrecta. Revisá el mail que te llegó cuando creaste la lista.');
      if(btn){btn.disabled=false;btn.textContent='Entrar';}
      return;
    }
    setHash({o:code}); renderOwner(code);
  } else { setHash({g:code}); renderGuest(code); }
}

  step = step || _ownerStep || 1;
  _ownerStep = step;
  const data=await sGet('ev:'+code);
  if(!data){render('<div class="card">Lista no encontrada.</div>');return;}
  const BASE_URL='https://elregalo.com.ar/';
  const guestLink=BASE_URL+'#g='+code;
  render(`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
      <h1 style="margin:0;font-size:1.3rem">🎁 ${esc(data.title)}</h1>
    </div>
    <p class="sub" style="margin-bottom:12px">Panel del organizador</p>
    ${ownerStepContent(data,code,guestLink,step)}
    <div style="display:flex;gap:8px;margin-top:16px">

        🗑️ Borrar lista
      </button>
    </div>

<span class="privacy-link" data-a="showPrivacy">📄 Términos de uso y Privacidad</span></footer>
  `);
  clearTimeout(window._ownerTimer);
  window._ownerTimer=setTimeout(async()=>{
    if(getHash().o===code && _ownerStep===1){

      <p style="margin:0 0 10px;font-size:.9rem;font-weight:700;color:#1b4332">
        💸 Transferencias recibidas (${donations.length})
      </p>
      ${(()=>{
        // Agrupar por regalo
        const byGift={};
        donations.forEach(d=>{
          if(!byGift[d.giftId]) byGift[d.giftId]={name:d.giftId,giftName:d.giftName,total:0,list:[]};
          byGift[d.giftId].total+=(d.amountNum||0);
          byGift[d.giftId].list.push(d);

function ownerGiftList(data,code){
  if(!data.gifts.length) return '<div class="empty">Aún no hay regalos. Agregá el primero arriba ☝️</div>';
  return data.gifts.map(g=>`
    <div class="gift${g.claimedBy?' taken':''}">
      <div style="flex:1">
        <div class="gift-name">${esc(g.name)}</div>
        <div style="margin-top:2px">
          ${g.allowPhys?'<span class="badge">Físico</span>':''}${g.allowDig?'<span class="badge">Digital</span>':''}
        </div>
        ${g.claimedBy
          ? `<div class="claimed">${g.claimedConfirmed?'🔒 Confirmado para regalarte':'⏳ Reservado para regalarte'}</div>`
          : ''}
      </div>
      <div style="display:flex;flex-direction:column;gap:4px;flex-shrink:0">
        ${g.claimedBy?`<button class="ghost sm" data-a="freeGift" data-x="${esc(code)}" data-y="${esc(g.id)}">Liberar</button>`:''}
        <button class="ghost sm" style="color:#c0392b;border-color:#c0392b" data-a="deleteGift" data-x="${esc(code)}" data-y="${esc(g.id)}">✕</button>
      </div>
    </div>
  `).join('');
}

async function addGift(code){
  const nameEl=document.getElementById('newName');
  const linkEl=document.getElementById('newLink');
  const name=(nameEl||{}).value||'';
  const manualLink=((linkEl||{}).value||'').trim();
  if(!name.trim()){alert('Escribí el nombre del regalo');return;}
  const allowPhys=document.getElementById('allowPhys')&&document.getElementById('allowPhys').checked;
  const allowDig=document.getElementById('allowDig')&&document.getElementById('allowDig').checked;
  const data=await sGet('ev:'+code);
  if(!data){alert('No se encontró la lista');return;}
  const priceEl=document.getElementById('newPrice');
  const price=((priceEl||{}).value||'').trim();
  const allowMoney=!!(document.getElementById('allowMoney')&&document.getElementById('allowMoney').checked);
  if(allowMoney&&!data.alias){
    if(!confirm('⚠️ Habilitaste "Regalar el valor estimado" pero no cargaste tu alias/CBU.\n\nSin alias nadie puede transferirte. ¿Querés agregarlo después en Mis datos?\n\nTocá Aceptar para continuar igual, o Cancelar para cargarlo primero.')){return;}
  }
  data.gifts.push({id:uid(),name:name.trim(),allowPhys,allowDig,allowMoney,manualLink:manualLink||null,price:price||null,claimedBy:null});
  await sSet('ev:'+code,data);
  renderOwner(code);
}

async function deleteGift(code,gid){
  const data=await sGet('ev:'+code);
  if(!data)return;
  data.gifts=data.gifts.filter(g=>g.id!==gid);
  await sSet('ev:'+code,data);
  renderOwner(code);
}

async function freeGift(code,gid){
  const data=await sGet('ev:'+code);
  if(!data)return;
  const g=data.gifts.find(x=>x.id===gid);
  if(g){g.claimedBy=null;g.claimedType=null;g.claimedCity=null;g.claimedConfirmed=false;}
  await sSet('ev:'+code,data);
  renderOwner(code);
}

  // Cargar nombre guardado solo para esta lista específica
  if(_currentGuestCode !== code){
    _currentGuestCode = code;
    guestName = loadGuestName(code);

  if(!guestName){
    const data=await sGet('ev:'+code);
    if(!data){render('<div class="card">Lista no encontrada.</div>');return;}
    render(`
      <h1>🎁 ${esc(data.title)}</h1>
      <p class="sub">¡Bienvenido! Primero necesito saber tu nombre.</p>
      <div class="card">
        <label>Tu nombre (para confirmar quién da el regalo — no se muestra públicamente)</label>
        <input id="nameInput" placeholder="Tu nombre">
        <button data-a="setName" data-x="${esc(code)}">Continuar</button>
      </div>
    `);
    return;
  }
  const data=await sGet('ev:'+code);
  if(!data){render('<div class="card">Lista no encontrada.</div>');return;}
  const occInfo=occ(data);
  render(`
    <div class="occasion-icon">${occInfo.icon}</div>

      ${guestGiftList(data,code)}
    </div>
    <footer>Código: ${esc(code)}</footer>
  `);
  clearTimeout(window._guestTimer);
  window._guestTimer=setTimeout(async()=>{
    if(getHash().g===code){ const d=await sGet('ev:'+code); if(d){ const el=document.querySelector('.card:last-of-type'); if(el)el.innerHTML=guestGiftList(d,code); } }
  },5000);
}

function guestGiftList(data,code){
  if(!data.gifts.length) return '<div class="empty">El organizador todavía no agregó regalos.</div>';
  return data.gifts.map(g=>{
    const isMe = g.claimedBy===guestName;
    const taken = !!g.claimedBy;
    const confirmed = g.claimedConfirmed;
    let statusLabel='';
    if(taken && confirmed && isMe)
      statusLabel=`<div class="claimed">🔒 Ya confirmaste este regalo — es tuyo</div>`;
    else if(taken && confirmed)
      statusLabel=`<div class="claimed">🔒 Ya fue seleccionado para regalo</div>`;
    else if(taken && isMe)
      statusLabel=`<div class="claimed" style="color:#b07d00">⏳ Lo tenés vos — falta confirmar definitivamente</div>`;
    else if(taken)
      statusLabel=`<div class="claimed" style="color:#b07d00">⏳ Ya fue reservado para regalo</div>`;
    let actionBtn='';
    if(!taken){
      actionBtn=`
        <div style="display:flex;flex-direction:column;gap:4px">
          <button class="sm" data-a="pickGift" data-x="${esc(code)}" data-y="${esc(g.id)}">Elegir regalo</button>
          ${g.allowMoney&&data.alias?`<button class="sm" data-a="giftMoney" data-x="${esc(code)}" data-y="${esc(g.id)}"
            style="background:#fff;color:var(--accent);border:1.5px solid var(--accent);font-size:.78rem">
            💸 Regalar el valor estimado
          </button>`:''}
        </div>`;
    } else if(isMe && !confirmed){
      // Es mío pero sin confirmar: muestro dos botones
      actionBtn=`
        <div style="display:flex;flex-direction:column;gap:4px">
          <button class="sm" data-a="reopenConfirm" data-x="${esc(code)}" data-y="${esc(g.id)}"
            style="background:var(--accent);color:#fff;white-space:nowrap">
            ✅ Confirmar regalo
          </button>
          <button class="ghost sm" data-a="cancelGift" data-x="${esc(code)}" data-y="${esc(g.id)}"
            style="color:#c0392b;border-color:#c0392b;font-size:.72rem">
            Cancelar reserva
          </button>
        </div>`;
    }
    return `
      <div class="gift${taken?' taken':''}">
        <div style="flex:1">
          <div class="gift-name">${esc(g.name)}</div>
          ${(()=>{
            const gDonations=(data.moneyDonations||[]).filter(d=>d.giftId===g.id);
            if(!gDonations.length||!g.price) return '';
            const total=gDonations.reduce((s,d)=>s+(d.amountNum||0),0);
            const priceN=parseArgNum(g.price);
            const pct=priceN>0?Math.min(100,Math.round(total/priceN*100)):0;
            const moneda=total>=1000||priceN>=1000?'$':'$';
            return `<div style="margin-top:6px">
              <div style="display:flex;justify-content:space-between;font-size:.72rem;margin-bottom:3px">
                <span style="color:var(--accent);font-weight:600">💚 Aportado: <b>${moneda}${total.toLocaleString('es-AR')}</b></span>
                <span style="color:var(--muted)">de ${esc(g.price)}</span>
              </div>
              <div style="background:#e0e0e0;border-radius:20px;height:8px;overflow:hidden">
                <div style="background:${pct>=100?'#27ae60':'var(--accent)'};height:8px;border-radius:20px;width:${pct}%;transition:width .3s"></div>
              </div>
              <p style="font-size:.7rem;color:${pct>=100?'#27ae60':'var(--muted)'};margin:3px 0 0;text-align:right">
                ${pct>=100?'✅ ¡Valor cubierto por aportes!':pct+'% del valor aportado'}
              </p>
            </div>`;
          })()}
          ${statusLabel}
        </div>
        <div style="flex-shrink:0">${actionBtn}</div>
      </div>
    `;
  }).join('');
}

function setName(){
  const n=(document.getElementById('nameInput')||{}).value||'';

  const links=buildLinks(g.name,g.claimedCity||'',g.claimedType||'físico',g.manualLink||null);

  const modal=document.createElement('div');

function selectCurrency(cur){
  document.getElementById('moneyCurrency').value=cur;
  document.getElementById('btnARS').style.background=cur==='ARS'?'var(--accent)':'#fff';
  document.getElementById('btnARS').style.color=cur==='ARS'?'#fff':'var(--muted)';
  document.getElementById('btnUSD').style.background=cur==='USD'?'#2d6a4f':'#fff';
  document.getElementById('btnUSD').style.color=cur==='USD'?'#fff':'var(--muted)';
}
function formatAmount(input){
  let v=input.value.replace(/[^0-9]/g,'');
  if(v) input.value=parseInt(v).toLocaleString('es-AR');
}
function parseArgNum(str){
  // Elimina todo excepto dígitos — maneja formato argentino con puntos de miles
  if(!str) return 0;
  return parseFloat(String(str).replace(/[^0-9]/g,'')) || 0;
}
function parseAmount(input){
  return parseArgNum(input.value||'0');
}

  modal.className='modal-bg';
  // Calcular total aportado
  const donations = (data.moneyDonations||[]).filter(d=>d.giftId===gid);
  const totalDonated = donations.reduce((sum,d)=>sum+(parseFloat(d.amountNum)||0),0);
  const priceNum = g.price ? parseArgNum(g.price) : 0;
  const remaining = priceNum>0 ? Math.max(0, priceNum-totalDonated) : 0;

  modal.innerHTML=`<div class="modal">
    <h3>💸 Aportar para: ${esc(g.name)}</h3>
    ${g.price?`

async function confirmMoneyGift(code,gid){
  const name=((document.getElementById('moneyGifterName')||{}).value||guestName||'').trim();
  if(!name){alert('Escribí tu nombre para avisarle al organizador.');return;}
  const data=await sGet('ev:'+code);
  const g=data&&data.gifts.find(x=>x.id===gid);
  if(!data||!g)return;
  if(!data.moneyDonations) data.moneyDonations=[];
  const amountInput=document.getElementById('moneyAmount');
  const currencyEl=document.getElementById('moneyCurrency');
  const currency=(currencyEl&&currencyEl.value)||'ARS';
  const amountNum=amountInput?parseAmount(amountInput):0;
  const symbol=currency==='USD'?'USD $':'$';
  const amountStr=amountNum>0?symbol+amountNum.toLocaleString('es-AR'):'(no especificado)';
  if(amountNum<=0){alert('Escribí cuánto transferiste.');return;}
  data.moneyDonations.push({
    id:uid(), gifterName:name, giftName:g.name,
    giftId:gid, amount:amountStr, amountNum:amountNum, timestamp:Date.now()
  });
  await sSet('ev:'+code,data);
  // Mostrar confirmación
  const modal=document.querySelector('.modal');
  if(modal) modal.innerHTML=`
    <div style="text-align:center;padding:20px 0">
      <div style="font-size:3rem;margin-bottom:12px">🎉</div>
      <p style="font-size:1rem;font-weight:700;color:#1b4332;margin:0 0 8px">¡Gracias ${esc(name)}!</p>
      <p style="font-size:.85rem;color:var(--muted);margin:0 0 16px;line-height:1.5">
        ${esc(data.owner)} fue notificado/a de tu aporte${amountNum>0?' de $'+amountNum.toLocaleString('es-AR'):''} para <b>${esc(g.name)}</b>.<br>
        ¡Muy generoso de tu parte! 💚
      </p>
      <button data-a="closeAndRefresh" data-x="${esc(code)}"
        style="width:100%;background:var(--accent);color:#fff;border:none;padding:12px;border-radius:8px;font-size:.9rem;cursor:pointer">
        Cerrar
      </button>
    </div>`;
}

function detectLocation(){
  const btn=document.getElementById('geoBtn');
  const cityInput=document.getElementById('pickCity');
  if(!navigator.geolocation){
    alert('Tu navegador no soporta detección de ubicación. Escribí tu ciudad a mano.');
    return;
  }
  if(btn){btn.disabled=true;btn.textContent='Detectando...';}
  navigator.geolocation.getCurrentPosition(
    async(pos)=>{
      const lat=pos.coords.latitude;
      const lon=pos.coords.longitude;
      // Convertimos coordenadas a nombre de ciudad con la API gratuita de Open-Meteo / Nominatim
      try{
        const r=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=es`);
        const d=await r.json();
        const city=d.address&&(d.address.city||d.address.town||d.address.village||d.address.county)||'';
        if(cityInput&&city) cityInput.value=city;
      }catch(e){
        // Si falla la geocodificación, dejamos las coordenadas como texto
        if(cityInput) cityInput.value=`${lat.toFixed(4)},${lon.toFixed(4)}`;
      }
      // Guardamos las coords para usar en los links de Maps
      window._geoLat=lat; window._geoLon=lon;
      if(btn){btn.disabled=false;btn.textContent='📍 Detectado';}
    },
    (err)=>{
      if(btn){btn.disabled=false;btn.textContent='📍 Detectar';}
      if(err.code===1) alert('No diste permiso de ubicación. Escribí tu ciudad a mano.');
      else alert('No se pudo detectar la ubicación. Escribí tu ciudad a mano.');
    },
    {timeout:10000}
  );
}

// Detecta qué tipo de tienda buscar según el nombre del regalo
function detectStore(name){
  const n=name.toLowerCase();
  if(/libro|novela|cuento|manual|guía|poesía|enciclopedia/.test(n))
    return {store:'librería',icon:'📚'};
  if(/juguete|muñeca|barbie|lego|auto a escala|peluche|juego de mesa|puzzle/.test(n))
    return {store:'juguetería',icon:'🧸'};
  if(/plato|vaso|olla|sartén|cubierto|taza|jarra|cacerola|bazar|vajilla|fuente|bowl/.test(n))
    return {store:'bazar',icon:'🏺'};
  if(/lavarropa|heladera|microondas|cocina|horno|lavavajilla|aire acondicionado|ventilador|aspiradora|plancha|electrodoméstico|cafetera|tostadora|licuadora/.test(n))
    return {store:'tienda de electrodomésticos',icon:'🏪'};
  if(/ropa|camisa|pantalón|vestido|zapato|zapatilla|calzado|remera|buzo|abrigo|jean/.test(n))
    return {store:'tienda de ropa',icon:'👕'};
  if(/celular|tablet|computadora|laptop|auricular|parlante|cámara|smartwatch/.test(n))
    return {store:'tienda de electrónica',icon:'📱'};
  if(/perfume|crema|maquillaje|cosmético|desodorante|colonia/.test(n))
    return {store:'perfumería',icon:'💄'};
  if(/bicicleta|pelota|tenis|fútbol|básquet|deportivo|gym|fitness/.test(n))
    return {store:'tienda deportiva',icon:'⚽'};
  if(/mueble|silla|mesa|sillón|estante|cama|colchón/.test(n))
    return {store:'mueblería',icon:'🪑'};
  if(/flor|planta|maceta/.test(n))
    return {store:'florería',icon:'🌸'};
  if(/vino|champagne|whisky|cerveza|bebida|gourmet/.test(n))
    return {store:'vinoteca',icon:'🍷'};
  // Por defecto: tienda general
  return {store:'tienda',icon:'🛍️'};
}

function buildLinks(name,city,type,manualLink){
  const q=encodeURIComponent(name);
  const hasGeo=window._geoLat&&window._geoLon;
  const links=[];
  if(manualLink){
    links.push({label:'🔗 Link del organizador (recomendado)',url:manualLink,highlight:true});
  }
  if(type==='digital'){
    links.push({label:'📱 Amazon Kindle',url:'https://www.amazon.com/s?k='+q+'+kindle+ebook'});
    links.push({label:'📱 Google Play Libros',url:'https://play.google.com/store/search?q='+q+'&c=books'});
    links.push({label:'🔍 Buscar ebook en Google',url:'https://www.google.com/search?q='+encodeURIComponent('comprar ebook '+name)});
  } else {
    const {store,icon}=detectStore(name);
    if(hasGeo){
      links.push({label:icon+' '+store.charAt(0).toUpperCase()+store.slice(1)+' más cercana',
        url:`https://www.google.com/maps/search/${encodeURIComponent(store)}/@${window._geoLat},${window._geoLon},14z`});
      links.push({label:'📍 Buscar "'+name+'" cerca tuyo',
        url:`https://www.google.com/maps/search/${q}+${encodeURIComponent(store)}/@${window._geoLat},${window._geoLon},13z`});
    } else if(city){
      links.push({label:icon+' '+store.charAt(0).toUpperCase()+store.slice(1)+' en '+city,
        url:'https://www.google.com/maps/search/'+encodeURIComponent(store+' '+city)});
      links.push({label:'📍 Buscar "'+name+'" en '+city,
        url:'https://www.google.com/maps/search/'+encodeURIComponent(name+' '+store+' '+city)});
    }
    links.push({label:'🛒 MercadoLibre',url:'https://listado.mercadolibre.com.ar/'+q.replace(/%20/g,'-')});
    links.push({label:'🛒 Amazon',url:'https://www.amazon.com/s?k='+q});
    links.push({label:'🔍 Buscar en Google',url:'https://www.google.com/search?q='+encodeURIComponent('comprar '+name+(city?' en '+city:''))});
  }
  return links;
}

async function confirmPick(code,gid){
  // PASO 1: reservar (provisional, aún se puede cancelar)
  let saved=false;
  try{
    const city=(document.getElementById('pickCity')||{}).value||'';
    const type=window._pickType||'físico';
    const data=await sGet('ev:'+code);
    const g=data&&data.gifts.find(x=>x.id===gid);
    if(!g||g.claimedBy){
      document.querySelector('.modal-bg')?.remove();
      alert('Otro ya lo reservó en este momento. Elegí otro.');
      renderGuest(code);
      return;
    }
    g.claimedBy=guestName; g.claimedType=type; g.claimedCity=city; g.claimedConfirmed=false;
    await sSet('ev:'+code,data);
    saved=true;
    window._geoLat=null; window._geoLon=null;
    const links=buildLinks(g.name,city,type,g.manualLink||null);
    const aliasSection=buildAliasSection(data,g);
    const area=document.getElementById('pickLinks');
    if(area) area.innerHTML=`
      <p style="font-size:.83rem;color:var(--green);margin:10px 0 4px">✓ Reservado provisoriamente. Dónde buscarlo:</p>
      <div class="buy-links">${links.map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener" style="${l.highlight?'background:#d4edda;font-weight:600;border:1px solid #5c7a52;':''}">${l.label} ↗</a>`).join('')}</div>
      <div style="background:#fff8e1;border:2px solid #f0c040;border-radius:12px;padding:16px;margin-top:14px">
        <p style="margin:0 0 6px;font-size:1rem;font-weight:700">⚠️ ¿Confirmás este regalo?</p>
        <p style="margin:0 0 12px;font-size:.83rem;color:#7a5c00;line-height:1.5">
          <b>Una vez que confirmás, no podés cancelarlo.</b><br>
          El regalo queda reservado para vos y nadie más puede elegirlo.<br>
          Si hay alguna duda, cerrá sin confirmar y pensalo mejor.
        </p>
        <button id="finalConfirmBtn" data-a="finalConfirm" data-x="${esc(code)}" data-y="${esc(gid)}"
          style="background:var(--accent);width:100%;padding:14px;font-size:.95rem;border-radius:10px">
          🎁 Sí, confirmo que voy a regalar esto
        </button>
        <button class="ghost sm" data-a="closeAndRefresh" data-x="${esc(code)}"
          style="width:100%;margin-top:8px;border-radius:10px">
          Mejor lo pienso — cerrar sin confirmar
        </button>
      </div>
    `;
    const cb=document.getElementById('confirmPickBtn');
    if(cb){cb.textContent='Cerrar (sin confirmar)';cb.setAttribute('data-a','closeAndRefresh');cb.setAttribute('data-x',code);}
    const cancelBtn=document.querySelector('.modal .row button.ghost');
    if(cancelBtn) cancelBtn.remove();
  }catch(e){
    if(saved){document.querySelector('.modal-bg')?.remove();renderGuest(code);}
    else{alert('Algo falló al reservar. Probá de nuevo.');}
  }
}

async function finalConfirm(code,gid){
  try{
    const data=await sGet('ev:'+code);
    const g=data&&data.gifts.find(x=>x.id===gid);
    if(!g||!g.claimedBy){document.querySelector('.modal-bg')?.remove();renderGuest(code);return;}
    g.claimedConfirmed=true;
    await sSet('ev:'+code,data);
    const area=document.getElementById('pickLinks');
    const ownerEmail=data.ownerEmail||null;
    const hasAddresses=(data.addrHome&&data.addrHome.calle)||(data.addrPost&&data.addrPost.calle);

      <div style="margin-top:10px;border:1px solid #5c7a52;border-radius:6px;padding:12px">
        <p style="margin:0 0 4px;font-size:.88rem;font-weight:600;color:#2d5a1b">📩 Avisarle a ${esc(data.owner)}</p>
        <p style="margin:0 0 8px;font-size:.78rem;color:var(--muted)">Estos botones abren tu app de correo con el mensaje ya escrito. Vos solo tocás <b>Enviar</b> ahí. Si no tenés correo configurado, usá "Copiar mensaje" y pegalo en WhatsApp.</p>
        <button data-a="notifyOwner" data-x="${esc(ownerEmail)}" data-y="${esc(g.name+'|||'+data.owner)}"
           style="display:block;width:100%;background:#5c7a52;color:#fff;text-align:center;padding:10px;border-radius:4px;font-size:.88rem;border:none;cursor:pointer;margin-bottom:6px">
          📧 Abrir correo con el aviso
        </button>
        <button data-a="copyMsg" data-x="${esc(notifyMsgText)}"
           style="display:block;width:100%;background:#fff;color:#5c7a52;text-align:center;padding:8px;border-radius:4px;font-size:.82rem;border:1px solid #5c7a52;cursor:pointer">
          📋 Copiar mensaje (para WhatsApp u otro)
        </button>
      </div>` : '';

    const requestSection=`
      <div style="margin-top:12px;border:1.5px solid var(--line);border-radius:12px;padding:14px">
        <p style="margin:0 0 6px;font-size:.92rem;font-weight:700">📦 ¿Querés enviarlo físicamente?</p>

        </p>
        <label style="font-size:.78rem">Tu nombre y contacto — teléfono, WhatsApp, etc. (obligatorio)</label>
        <input id="reqContact" placeholder="Ej: María — +54 11 1234-5678" style="margin-bottom:10px">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">

function buildNotifyMailto(email,giftName,ownerName){
  const subject=encodeURIComponent('Un regalo confirmado para vos 🎁');
  const body=encodeURIComponent(
    `Hola ${ownerName}!\n\n`+
    `Alguien confirmó que te va a regalar: "${giftName}". ¡No lo compres!\n\n`+
    `Saludos 🎉`
  );
  return `mailto:${email}?subject=${subject}&body=${body}`;
}

async function copyAddrReqMsg(code,gid){
  const data=await sGet('ev:'+code);
  const g=data&&data.gifts.find(x=>x.id===gid);
  if(!data||!g)return;
  const msg=`Hola ${data.owner}!\n\nAlguien que te va a hacer un regalo quiere enviártelo físicamente. ¿Podés responder con tu dirección de envío?\n\n¡Gracias! 🎁`;
  copyText(msg);
}

function openMailto(link){
  const a=document.createElement('a');
  a.href=link;
  a.style.display='none';
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>a.remove(),500);
}

async function sendAddrRequest(code,combined){
  const [gid,addrType]=combined.split('|||');
  const contact=((document.getElementById('reqContact')||{}).value||'').trim();
  if(!contact){alert('Escribí tu nombre y contacto para que el organizador pueda comunicarse con vos.');return;}
  const data=await sGet('ev:'+code);
  const g=data&&data.gifts.find(x=>x.id===gid);
  if(!data||!g){alert('No se encontró la lista.');return;}
  // Guardar solicitud en los datos del evento
  if(!data.addrRequests) data.addrRequests=[];
  data.addrRequests.push({
    id:uid(),
    guestName: guestName||contact,
    contact:   contact,
    type:      addrType,
    giftName:  g.name,
    timestamp: Date.now()
  });
  await sSet('ev:'+code, data);
  // Mostrar confirmación
  const reqDiv=document.querySelector('[data-a="sendAddrRequest"]')?.closest('div[style]');
  if(reqDiv){
    reqDiv.innerHTML=`
      <div style="background:#d4edda;border:2px solid var(--accent);border-radius:10px;padding:14px;text-align:center">
        <p style="margin:0 0 4px;font-size:.95rem;font-weight:700;color:#1b4332">✅ Solicitud enviada</p>
        <p style="margin:0;font-size:.82rem;color:#2d6a4f;line-height:1.5">
          El organizador va a ver tu pedido de dirección.<br>
          Se va a contactar con vos usando el contacto que dejaste.<br>
          <b>Aguardá su respuesta.</b>
        </p>
      </div>`;
  }
}

function buildAliasSection(data, g){
  if(!data.alias || !g.allowMoney) return '';
  return `
    <div style="margin-top:10px;background:#f0f7f0;border:2px solid var(--accent);border-radius:10px;padding:12px;text-align:center">
      <p style="margin:0 0 4px;font-size:.85rem;font-weight:700;color:#1b4332">💸 Opción: Regalar el valor estimado</p>
      ${g.price?`<p style="margin:0 0 8px;font-size:.78rem;color:#2d6a4f">Precio estimado: <b>${esc(g.price)}</b></p>`:''}
      <div style="background:#fff;border:1px solid var(--accent);border-radius:8px;padding:10px;font-size:1rem;font-weight:700;letter-spacing:1px;margin-bottom:8px">
        💳 ${esc(data.alias)}
      </div>
      <button data-a="copyText" data-x="${esc(data.alias)}"
        style="width:100%;background:var(--accent);color:#fff;border:none;padding:10px;border-radius:8px;font-size:.85rem;cursor:pointer">
        📋 Copiar alias para transferir
      </button>
    </div>`;
}

async function saveAlias(code){
  const alias=((document.getElementById('aliasInput')||{}).value||'').trim();
  const titular=((document.getElementById('aliasTitular')||{}).value||'').trim();
  const data=await sGet('ev:'+code);
  if(!data)return;
  data.alias=alias||null;
  data.aliasTitular=titular||null;
  await sSet('ev:'+code,data);
  renderOwner(code,2);
}

async function saveAddress(type,code){
  const prefix=type==='home'?'home':'post';
  const v=id=>(document.getElementById(prefix+id)||{}).value||'';
  const addr={nombre:v('Nombre').trim(),calle:v('Calle').trim(),ciudad:v('Ciudad').trim(),cp:v('CP').trim(),pais:v('Pais').trim(),notas:v('Notas').trim()};
  const data=await sGet('ev:'+code);
  if(!data)return;
  if(type==='home') data.addrHome=addr;
  else data.addrPost=addr;
  await sSet('ev:'+code,data);
  renderOwner(code);
}

function addrText(addr){
  if(!addr)return '';
  return [addr.nombre,addr.calle,addr.ciudad?(addr.ciudad+(addr.cp?' — CP: '+addr.cp:'')):addr.cp,addr.pais,addr.notas].filter(Boolean).join('\n');
}

function copyAddr(type,code){
  sGet('ev:'+code).then(data=>{
    if(!data)return;
    const addr=type==='home'?data.addrHome:data.addrPost;
    const txt=addrText(addr);
    if(!txt){alert('No hay dirección guardada todavía.');return;}
    navigator.clipboard.writeText(txt).then(()=>alert('¡Dirección copiada! Pegala en tu respuesta.')).catch(()=>prompt('Copiá esta dirección:',txt));
  });
}

// ── COMPARTIR ──
function getShareUrl(guestLink){
  // Si está en file://, el link no sirve para compartir — avisar
  if(guestLink.startsWith('file://')){
    return null;
  }
  return guestLink;
}

function shareNative(guestLink,title){
  const url=getShareUrl(guestLink);
  if(!url){
    alert('Para compartir el link necesitás publicar la app en internet (netlify.com/drop). Por ahora podés copiar el código de la lista y mandárselo.');
    return;
  }
  const txt=`🎁 ¡Ayudame eligiendo un regalo! Entrá a la lista: `;
  if(navigator.share){
    navigator.share({title,text:txt,url}).catch(()=>{});
  } else {
    copyText(url);
    alert('Link copiado. Pegalo en WhatsApp, Instagram o donde quieras.');
  }
}

function shareFacebook(guestLink){
  const url=getShareUrl(guestLink);
  if(!url){alert('Publicá la app en Netlify primero para poder compartir en redes.');return;}
  window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(url),'_blank');
}

function shareX(guestLink,title){
  const url=getShareUrl(guestLink);
  if(!url){alert('Publicá la app en Netlify primero para poder compartir en redes.');return;}
  const txt=encodeURIComponent('🎁 ¡Ayudame a elegir mi regalo! '+url);
  window.open('https://twitter.com/intent/tweet?text='+txt,'_blank');
}

function shareInstagram(guestLink){
  const url=getShareUrl(guestLink);
  if(!url){alert('Publicá la app en Netlify primero para poder compartir en redes.');return;}
  // Instagram no tiene API de compartir directa — se copia el link
  copyText(url);
  alert('📋 Link copiado. Abrí Instagram, pegalo en tu bio o en una historia como link.');
}

function shareOther(guestLink,title){
  const url=getShareUrl(guestLink);
  if(!url){alert('Publicá la app en Netlify primero para poder compartir.');return;}
  if(navigator.share){
    navigator.share({title,url}).catch(()=>{});
  } else {
    copyText(url);
    alert('Link copiado al portapapeles.');
  }
}

function clearLastList(){
  try{localStorage.removeItem('lastOwnerCode');localStorage.removeItem('lastOwnerTitle');}catch(e){}
  renderHome();
}

async function deleteList(code){
  if(!confirm('¿Seguro que querés borrar toda la lista? Esta acción no se puede deshacer.')) return;
  // Borrar del storage
  try{ await sSet('ev:'+code, null); }catch(e){}
  // Borrar del localStorage si era la lista guardada
  if(lsGet('lastOwnerCode')===code){
    try{localStorage.removeItem('lastOwnerCode');localStorage.removeItem('lastOwnerTitle');}catch(e){}
  }
  renderHome();
}

(async function init(){
  const h=getHash();
  if(h.o) renderOwner(h.o);
  else if(h.g) renderGuest(h.g);
  else renderHome();
})();
window.addEventListener('hashchange',function(){
  if(_showingCreated) return; // no pisar la pantalla de confirmación
  clearTimeout(window._ownerTimer);clearTimeout(window._guestTimer);
  const h=getHash();
  if(h.o) renderOwner(h.o);
  else if(h.g) renderGuest(h.g);
  else renderHome();
});
</script>
